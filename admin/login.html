.access-list li a { border-radius: 12px; }
.access-list li a:hover { background: #F4F7FF; border-color: var(--border); }
.access-list svg { background: var(--green-tint); border-radius: 50%; padding: 3px; width: 22px; height: 22px; }

/* ---------- broadsheet ---------- */
.act { border-radius: 14px; box-shadow: var(--shadow-sm); }
.bar2 { height: 8px; border-radius: 8px; }
.matrix-wrap { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.mx thead th { background: var(--navy); letter-spacing: .01em; }
.mx thead tr.r2 th { background: var(--navy-2); }
.mx input { border-radius: 8px; background: #fff; }
.mx input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,154,46,.25); }
.mx td.st { background: #F4F7FF; } .mx td.ov { background: #FFF8E8; }

/* ---------- report cards (admin UI only; the printed card keeps its own look) ---------- */
.plist { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.prow { transition: background .15s; } .prow:hover { background: #F6F8FE; }
.prow h3 { font-weight: 700; }
.ctl { border-radius: var(--radius); }

/* ---------- login page ---------- */
body:has(#loginForm) { background-color: var(--navy-deep); background-image: radial-gradient(700px 500px at 15% 10%, rgba(201,154,46,.25), transparent 60%), radial-gradient(800px 600px at 90% 90%, rgba(122,34,51,.45), transparent 60%), linear-gradient(135deg, var(--navy-2), var(--navy-deep)); background-attachment: fixed; }
body:has(#loginForm)::before { left: 0; right: 0; width: auto; top: 0; bottom: 0; border: none; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 26px 26px; }
body:has(#loginForm) .card { border-radius: 24px; padding: 46px 36px 32px; box-shadow: 0 40px 80px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); backdrop-filter: none; }
body:has(#loginForm) .card::before { height: 5px; background: linear-gradient(90deg, var(--maroon), var(--gold)); }
body:has(#loginForm) .brand img { box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--border-strong); }
body:has(#loginForm) .brand span { font-family: var(--sans); font-weight: 700; }
body:has(#loginForm) h1 { font-weight: 800; letter-spacing: -0.03em; font-size: 30px; }
body:has(#loginForm) .btn-submit { min-height: 52px; font-size: 15.5px; }
body:has(#loginForm) .message { border-radius: 12px; border-left-width: 0; border: 1px solid #F2C4BF; }
body:has(#loginForm) .back-link { border-top: 1px solid var(--border); }

/* ---------- motion ---------- */
@keyframes mdRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.wrap > * { animation: mdRise .45s cubic-bezier(.22,1,.36,1) both; }
.wrap > *:nth-child(2) { animation-delay: .04s; } .wrap > *:nth-child(3) { animation-delay: .08s; } .wrap > *:nth-child(4) { animation-delay: .12s; }
@media (prefers-reduced-motion: reduce) { .wrap > * { animation: none !important; } }

/* ---------- print: keep documents clean ---------- */
@media print {
  body { background: #fff !important; }
  .wrap > * { animation: none !important; }
  .welcome h1::after { display: none; }
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="/assets/images/logo.png" alt="School logo">
    <span class="js-school-name">Al-Haqq Nur &amp; Pry School</span>
  </div>
  <h1>Admin Portal</h1>
  <p>Restricted to school administrators.</p>
  <div id="message" class="message"></div>
  <form id="loginForm">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
  </form>
  <div class="back-link"><a href="/login.html">← Back to parent/staff login</a></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient('https://txsmxpcnbbjubfpxtdrb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4c214cGNuYmJqdWJmcHh0ZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDEwMjksImV4cCI6MjEwNTg3NzAyOX0.1hKfqjPMeqsMz_MG7fRLttcJapz_FOMTxNDHfp2DJso')

  const messageEl = document.getElementById('message')
  const submitBtn = document.getElementById('submitBtn')

  function showMessage(text) {
    messageEl.textContent = text
    messageEl.className = 'message error'
  }

  async function loadSchoolName() {
    const { data, error } = await supabase.from('schools').select('name').order('created_at', { ascending: true }).limit(1).single()
    if (!error && data) {
      document.querySelectorAll('.js-school-name').forEach(el => { el.textContent = data.name })
    }
  }
  loadSchoolName()

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    messageEl.className = 'message'
    submitBtn.disabled = true
    submitBtn.textContent = 'Signing in…'

    try {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password })
      if (signInError) throw signInError

      const { data: membership, error: memberError } = await supabase
        .from('school_members')
        .select('role')
        .eq('user_id', signInData.user.id)
        .single()

      if (memberError || !membership) {
        await supabase.auth.signOut()
        throw new Error('Your account is not linked to any role at this school yet.')
      }

      const redirects = {
        super_admin: '/admin/dashboard.html',
        school_admin: '/admin/dashboard.html'
      }

      const destination = redirects[membership.role]
      if (!destination) {
        await supabase.auth.signOut()
        throw new Error('This login is for school administrators only.')
      }

      const next = new URLSearchParams(window.location.search).get('next')
      const safeNext = next && next.startsWith('/admin/') && !next.startsWith('//') ? next : null
      window.location.href = safeNext || destination

    } catch (err) {
      showMessage(err.message || 'Login failed. Please check your details and try again.')
      submitBtn.disabled = false
      submitBtn.textContent = 'Sign In'
    }
  })
</script>

</body>
</html>
