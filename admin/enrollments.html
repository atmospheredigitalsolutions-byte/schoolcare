<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enrollments — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #101B3D; --navy-deep: #0B1329; --maroon: #6E1F2B; --maroon-dark: #551620;
  --cream: #F6F1E7; --paper: #FBF8F2; --gold: #B98B2A; --ink: #1E1A16;
  --muted: #6b5f52; --border: #E3DACB; --green: #2E7D32; --red: #B3261E;
}
body { font-family: 'Inter', Arial, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; min-height: 100vh; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; }
a { color: inherit; text-decoration: none; }
button, select { font: inherit; }

.topbar { background: var(--paper); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand img { width: 32px; height: 32px; border-radius: 50%; }
.topbar .brand strong { font-family: 'Fraunces', serif; color: var(--navy); font-size: 15px; }
.topbar .brand span { display: block; font-size: 11px; color: var(--muted); }
.signout { font-size: 13px; font-weight: 600; color: var(--maroon); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; background: var(--paper); }

.wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 90px; }
.welcome h1 { font-size: 24px; color: var(--navy); margin-bottom: 4px; }
.welcome p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

.card { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.app-card .top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--muted); overflow: hidden; flex-shrink: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.app-card h3 { font-size: 16.5px; color: var(--navy); }
.app-card .sub { font-size: 12.5px; color: var(--muted); }
.detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.detail-row:last-of-type { border-bottom: none; margin-bottom: 14px; }
.detail-row span:first-child { color: var(--muted); }
.detail-row span:last-child { font-weight: 600; text-align: right; }

.select-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
select { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; font-size: 13.5px; }
.action-row { display: flex; gap: 10px; }
.btn-admit { flex: 1; padding: 12px; border: none; border-radius: 10px; background: var(--green); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn-reject { flex: 1; padding: 12px; border: 1.5px solid var(--red); border-radius: 10px; background: #fff; color: var(--red); font-weight: 700; font-size: 14px; cursor: pointer; }
.btn-admit:disabled, .btn-reject:disabled { opacity: 0.6; }

.msg { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; display: none; }
.msg.success { background: #e9f5ea; color: var(--green); display: block; }
.msg.error { background: #fbeaea; color: var(--red); display: block; }
.empty-note { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 0; }
.loading { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
.bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 6px; border-radius: 10px; color: var(--muted); font-size: 9.5px; font-weight: 600; flex: 1; text-align: center; }
.bn-item svg { width: 19px; height: 19px; }
.bn-item.active { color: var(--maroon); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/assets/images/logo.png" alt="logo">
    <div><strong class="js-school-name">Al-Haqq Nur &amp; Pry School</strong><span>Admin Portal</span></div>
  </div>
  <button class="signout" id="signOutBtn">Sign Out</button>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="welcome">
    <h1>Pending Enrollments</h1>
    <p>Review each application, then admit into a class &amp; term, or reject.</p>
  </div>
  <div id="msgBox" class="msg"></div>
  <div id="appList"></div>
</div>

<div id="loadingState" class="loading">Loading…</div>

<nav class="bottom-nav">
  <a href="/admin/dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></a>
  <a href="/admin/enrollments.html" class="bn-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg><span>Enrollments</span></a>
  <a href="/admin/staff.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span>Staff</span></a>
  <a href="/admin/students.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Students</span></a>
  <a href="/admin/profile.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>Profile</span></a>
</nav>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient('https://txsmxpcnbbjubfpxtdrb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4c214cGNuYmJqdWJmcHh0ZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDEwMjksImV4cCI6MjEwNTg3NzAyOX0.1hKfqjPMeqsMz_MG7fRLttcJapz_FOMTxNDHfp2DJso')

  let currentUser = null
  let schoolId = null
  let classes = []
  let terms = []

  function studentName(s) { return [s.surname, s.other_names].filter(Boolean).join(' ') || 'Unnamed Student' }
  function initials(s) { return ((s.surname || '')[0] || '') + ((s.other_names || '')[0] || '') }
  function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—' }
  function showMessage(text, type) {
    const box = document.getElementById('msgBox')
    box.textContent = text
    box.className = 'msg ' + type
    setTimeout(() => { box.className = 'msg' }, 4000)
  }

  async function loadSchoolName() {
    const { data } = await supabase.from('schools').select('name').order('created_at', { ascending: true }).limit(1).single()
    if (data) document.querySelectorAll('.js-school-name').forEach(el => { el.textContent = data.name })
  }

  async function init() {
    loadSchoolName()
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = '/admin/login.html'; return }
    currentUser = session.user

    const { data: membership } = await supabase.from('school_members').select('role, school_id').eq('user_id', currentUser.id).single()
    if (!membership || !['school_admin', 'super_admin'].includes(membership.role)) { window.location.href = '/admin/login.html'; return }
    schoolId = membership.school_id

    const { data: classData } = await supabase.from('classes').select('id, name').eq('school_id', schoolId).order('name')
    classes = classData || []
    const { data: termData } = await supabase.from('terms').select('id, name').order('start_date', { ascending: false })
    terms = termData || []

    await loadPending()

    document.getElementById('loadingState').style.display = 'none'
    document.getElementById('appWrap').style.display = 'block'
  }

  async function loadPending() {
    const container = document.getElementById('appList')
    const { data, error } = await supabase
      .from('students')
      .select('id, surname, other_names, date_of_birth, gender, former_school_name, former_school_class, photo_url, address')
      .eq('school_id', schoolId)
      .eq('admission_status', 'pending')

    if (error || !data || data.length === 0) {
      container.innerHTML = '<p class="empty-note">No pending applications right now.</p>'
      return
    }

    container.innerHTML = data.map(s => `
      <div class="card app-card" data-id="${s.id}">
        <div class="top">
          <div class="avatar">${s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s)}</div>
          <div>
            <h3>${studentName(s)}</h3>
            <div class="sub">${s.gender || '—'} · DOB ${formatDate(s.date_of_birth)}</div>
          </div>
        </div>
        <div class="detail-row"><span>Former School</span><span>${s.former_school_name || '—'}</span></div>
        <div class="detail-row"><span>Former Class</span><span>${s.former_school_class || '—'}</span></div>
        <div class="detail-row"><span>Address</span><span>${s.address || '—'}</span></div>

        <div class="select-row">
          <select class="classSelect">
            <option value="">Assign class…</option>
            ${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
          <select class="termSelect">
            <option value="">Assign term…</option>
            ${terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
          </select>
        </div>
        <div class="action-row">
          <button class="btn-admit">Admit</button>
          <button class="btn-reject">Reject</button>
        </div>
      </div>
    `).join('')

    container.querySelectorAll('.app-card').forEach(card => {
      const studentId = card.dataset.id
      card.querySelector('.btn-admit').addEventListener('click', () => admitStudent(studentId, card))
      card.querySelector('.btn-reject').addEventListener('click', () => rejectStudent(studentId, card))
    })
  }

  async function admitStudent(studentId, card) {
    const classId = card.querySelector('.classSelect').value
    const termId = card.querySelector('.termSelect').value
    if (!classId || !termId) { showMessage('Please choose a class and term before admitting.', 'error'); return }

    const btn = card.querySelector('.btn-admit')
    btn.disabled = true
    btn.textContent = 'Admitting…'

    const { error: updateError } = await supabase.from('students').update({
      admission_status: 'admitted',
      class_id: classId,
      admitted_by: currentUser.id,
      admitted_at: new Date().toISOString()
    }).eq('id', studentId)

    if (updateError) {
      showMessage('Could not admit student: ' + updateError.message, 'error')
      btn.disabled = false
      btn.textContent = 'Admit'
      return
    }

    const { error: enrollError } = await supabase.from('enrollments').insert({
      student_id: studentId,
      class_id: classId,
      term_id: termId,
      admitted_at: new Date().toISOString().slice(0, 10)
    })

    if (enrollError) { showMessage('Student admitted, but enrollment record failed: ' + enrollError.message, 'error') }
    else { showMessage('Student admitted and enrolled successfully.', 'success') }

    card.remove()
    checkEmpty()
  }

  async function rejectStudent(studentId, card) {
    const btn = card.querySelector('.btn-reject')
    btn.disabled = true
    btn.textContent = 'Rejecting…'

    const { error } = await supabase.from('students').update({ admission_status: 'rejected' }).eq('id', studentId)

    if (error) {
      showMessage('Could not reject application: ' + error.message, 'error')
      btn.disabled = false
      btn.textContent = 'Reject'
      return
    }

    showMessage('Application rejected.', 'success')
    card.remove()
    checkEmpty()
  }

  function checkEmpty() {
    const container = document.getElementById('appList')
    if (container.querySelectorAll('.app-card').length === 0) {
      container.innerHTML = '<p class="empty-note">No pending applications right now.</p>'
    }
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = '/admin/login.html'
  })

  init()
</script>

</body>
</html>
