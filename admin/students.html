<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #101B3D; --navy-deep: #0B1329; --maroon: #6E1F2B; --maroon-dark: #551620;
  --cream: #F6F1E7; --paper: #FBF8F2; --gold: #B98B2A; --ink: #1E1A16;
  --muted: #6b5f52; --border: #E3DACB;
}
body { font-family: 'Inter', Arial, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; min-height: 100vh; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; }
a { color: inherit; text-decoration: none; }
button, select, input { font: inherit; }

.topbar { background: var(--paper); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand img { width: 32px; height: 32px; border-radius: 50%; }
.topbar .brand strong { font-family: 'Fraunces', serif; color: var(--navy); font-size: 15px; }
.topbar .brand span { display: block; font-size: 11px; color: var(--muted); }
.signout { font-size: 13px; font-weight: 600; color: var(--maroon); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; background: var(--paper); }

.wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 90px; }
.welcome h1 { font-size: 24px; color: var(--navy); margin-bottom: 4px; }
.welcome p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

.card { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
select, input { padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; font-size: 13.5px; }
select:focus, input:focus { outline: none; border-color: var(--navy); }

.student-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.student-row:last-child { border-bottom: none; }
.s-photo { width: 44px; height: 44px; border-radius: 50%; background: var(--cream); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; font-size: 14px; overflow: hidden; }
.s-photo img { width: 100%; height: 100%; object-fit: cover; }
.s-info .name { font-size: 14.5px; font-weight: 600; }
.s-info .meta { font-size: 12px; color: var(--muted); }
.status-badge { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; text-transform: capitalize; }
.status-badge.admitted { background: #e9f5ea; color: #2E7D32; }
.status-badge.pending { background: #fdf3e2; color: var(--gold); }
.status-badge.rejected { background: #fbeaea; color: #B3261E; }

.detail-overlay { position: fixed; inset: 0; background: rgba(11,19,41,0.5); z-index: 100; display: none; align-items: flex-end; }
.detail-overlay.open { display: flex; }
.detail-sheet { background: var(--paper); width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 24px 22px 32px; }
.detail-top { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.detail-close { width: 34px; height: 34px; border-radius: 50%; background: var(--cream); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.detail-photo { width: 76px; height: 76px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--muted); overflow: hidden; margin-bottom: 14px; }
.detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.detail-sheet h2 { font-size: 20px; color: var(--navy); margin-bottom: 14px; }
.detail-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.detail-row span:first-child { color: var(--muted); }
.detail-row span:last-child { font-weight: 600; text-align: right; }

.empty-note { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }
.loading { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
.bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 6px; border-radius: 10px; color: var(--muted); font-size: 9.5px; font-weight: 600; flex: 1; text-align: center; }
.bn-item svg { width: 19px; height: 19px; }
.bn-item.active { color: var(--maroon); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/assets/images/logo.png" alt="logo">
    <div><strong class="js-school-name">Al-Haqq Nur &amp; Pry School</strong><span>Admin Portal</span></div>
  </div>
  <button class="signout" id="signOutBtn">Sign Out</button>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="welcome">
    <h1>Students</h1>
    <p>Every student record at your school.</p>
  </div>

  <div class="card">
    <div class="filter-row">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="admitted">Admitted</option>
        <option value="pending">Pending</option>
        <option value="rejected">Rejected</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search by name…">
    </div>
  </div>

  <div class="card">
    <div id="studentList"></div>
  </div>
</div>

<div id="loadingState" class="loading">Loading…</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet">
    <div class="detail-top"><button class="detail-close" id="detailClose">✕</button></div>
    <div class="detail-photo" id="detailPhoto"></div>
    <h2 id="detailName"></h2>
    <div id="detailBody"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="/admin/dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></a>
  <a href="/admin/enrollments.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg><span>Enrollments</span></a>
  <a href="/admin/staff.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span>Staff</span></a>
  <a href="/admin/students.html" class="bn-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Students</span></a>
  <a href="/admin/profile.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>Profile</span></a>
</nav>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient('https://txsmxpcnbbjubfpxtdrb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4c214cGNuYmJqdWJmcHh0ZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDEwMjksImV4cCI6MjEwNTg3NzAyOX0.1hKfqjPMeqsMz_MG7fRLttcJapz_FOMTxNDHfp2DJso')

  let schoolId = null
  let allStudents = []

  function studentName(s) { return [s.surname, s.other_names].filter(Boolean).join(' ') || 'Unnamed Student' }
  function initials(s) { return ((s.surname || '')[0] || '') + ((s.other_names || '')[0] || '') }
  function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—' }

  async function loadSchoolName() {
    const { data } = await supabase.from('schools').select('name').order('created_at', { ascending: true }).limit(1).single()
    if (data) document.querySelectorAll('.js-school-name').forEach(el => { el.textContent = data.name })
  }

  async function init() {
    loadSchoolName()
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = '/admin/login.html'; return }

    const { data: membership } = await supabase.from('school_members').select('role, school_id').eq('user_id', session.user.id).single()
    if (!membership || !['school_admin', 'super_admin'].includes(membership.role)) { window.location.href = '/admin/login.html'; return }
    schoolId = membership.school_id

    const { data } = await supabase
      .from('students')
      .select('id, surname, other_names, date_of_birth, gender, admission_number, admission_status, photo_url, classes(name)')
      .eq('school_id', schoolId)

    allStudents = data || []
    renderList()

    document.getElementById('statusFilter').addEventListener('change', renderList)
    document.getElementById('searchInput').addEventListener('input', renderList)

    document.getElementById('loadingState').style.display = 'none'
    document.getElementById('appWrap').style.display = 'block'
  }

  function renderList() {
    const status = document.getElementById('statusFilter').value
    const query = document.getElementById('searchInput').value.trim().toLowerCase()

    let filtered = allStudents
    if (status) filtered = filtered.filter(s => s.admission_status === status)
    if (query) filtered = filtered.filter(s => studentName(s).toLowerCase().includes(query))

    const container = document.getElementById('studentList')
    if (filtered.length === 0) {
      container.innerHTML = '<p class="empty-note">No students match.</p>'
      return
    }

    filtered.sort((a, b) => (a.surname || '').localeCompare(b.surname || ''))

    container.innerHTML = filtered.map(s => `
      <div class="student-row" data-id="${s.id}">
        <div class="s-photo">${s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s)}</div>
        <div class="s-info">
          <div class="name">${studentName(s)}</div>
          <div class="meta">${s.classes?.name || 'No class'} · ${s.admission_number || 'No adm. no.'}</div>
        </div>
        <div class="status-badge ${s.admission_status}">${s.admission_status}</div>
      </div>
    `).join('')

    container.querySelectorAll('.student-row').forEach(row => {
      row.addEventListener('click', () => openDetail(row.dataset.id))
    })
  }

  function openDetail(id) {
    const s = allStudents.find(x => x.id === id)
    if (!s) return
    document.getElementById('detailPhoto').innerHTML = s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s)
    document.getElementById('detailName').textContent = studentName(s)
    document.getElementById('detailBody').innerHTML = `
      <div class="detail-row"><span>Admission No.</span><span>${s.admission_number || '—'}</span></div>
      <div class="detail-row"><span>Class</span><span>${s.classes?.name || '—'}</span></div>
      <div class="detail-row"><span>Date of Birth</span><span>${formatDate(s.date_of_birth)}</span></div>
      <div class="detail-row"><span>Gender</span><span>${s.gender || '—'}</span></div>
      <div class="detail-row"><span>Status</span><span style="text-transform:capitalize;">${s.admission_status}</span></div>
    `
    document.getElementById('detailOverlay').classList.add('open')
  }
  document.getElementById('detailClose').addEventListener('click', () => document.getElementById('detailOverlay').classList.remove('open'))
  document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'detailOverlay') document.getElementById('detailOverlay').classList.remove('open')
  })

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = '/admin/login.html'
  })

  init()
</script>

</body>
</html>
