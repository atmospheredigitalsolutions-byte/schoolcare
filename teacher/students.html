<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #101B3D; --navy-deep: #0B1329; --maroon: #6E1F2B; --maroon-dark: #551620;
  --cream: #F6F1E7; --paper: #FBF8F2; --gold: #B98B2A; --ink: #1E1A16;
  --muted: #6b5f52; --border: #E3DACB;
}
body { font-family: 'Inter', Arial, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; min-height: 100vh; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; }
a { color: inherit; text-decoration: none; }
button, select { font: inherit; }

.topbar { background: var(--paper); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand img { width: 32px; height: 32px; border-radius: 50%; }
.topbar .brand strong { font-family: 'Fraunces', serif; color: var(--navy); font-size: 15px; }
.topbar .brand span { display: block; font-size: 11px; color: var(--muted); }
.signout { font-size: 13px; font-weight: 600; color: var(--maroon); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; background: var(--paper); }

.wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 90px; }
.welcome h1 { font-size: 24px; color: var(--navy); margin-bottom: 4px; }
.welcome p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

.card { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.field-row { display: flex; flex-direction: column; gap: 6px; }
.field-row label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
select { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
select:focus { outline: none; border-color: var(--navy); }

.student-card { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.student-card:last-child { border-bottom: none; }
.student-photo { width: 48px; height: 48px; border-radius: 50%; background: var(--cream); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; font-size: 15px; overflow: hidden; }
.student-photo img { width: 100%; height: 100%; object-fit: cover; }
.student-info .name { font-size: 15px; font-weight: 600; color: var(--ink); }
.student-info .meta { font-size: 12.5px; color: var(--muted); }

.detail-overlay { position: fixed; inset: 0; background: rgba(11,19,41,0.5); z-index: 100; display: none; align-items: flex-end; }
.detail-overlay.open { display: flex; }
.detail-sheet { background: var(--paper); width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 24px 22px 32px; }
.detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.detail-close { width: 34px; height: 34px; border-radius: 50%; background: var(--cream); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.detail-photo { width: 76px; height: 76px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--muted); overflow: hidden; margin-bottom: 14px; }
.detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.detail-sheet h2 { font-size: 20px; color: var(--navy); margin-bottom: 4px; }
.detail-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.detail-row span:first-child { color: var(--muted); }
.detail-row span:last-child { font-weight: 600; color: var(--ink); text-align: right; }

.empty-note { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }
.loading { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
.bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 10px; border-radius: 10px; color: var(--muted); font-size: 10.5px; font-weight: 600; flex: 1; text-align: center; }
.bn-item svg { width: 21px; height: 21px; }
.bn-item.active { color: var(--maroon); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/assets/images/logo.png" alt="logo">
    <div><strong class="js-school-name">Al-Haqq Nur &amp; Pry School</strong><span>Teacher Portal</span></div>
  </div>
  <button class="signout" id="signOutBtn">Sign Out</button>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="welcome">
    <h1>Students</h1>
    <p>Your class roster, by term.</p>
  </div>

  <div class="card">
    <div class="field-row">
      <label for="classSelect">Class &amp; Term</label>
      <select id="classSelect"></select>
    </div>
  </div>

  <div class="card">
    <div id="rosterList"></div>
  </div>
</div>

<div id="loadingState" class="loading">Loading…</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet">
    <div class="detail-top">
      <div></div>
      <button class="detail-close" id="detailClose">✕</button>
    </div>
    <div class="detail-photo" id="detailPhoto"></div>
    <h2 id="detailName"></h2>
    <div id="detailBody"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="/teacher/dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></a>
  <a href="/teacher/students.html" class="bn-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Students</span></a>
  <a href="/teacher/report-cards.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Reports</span></a>
  <a href="/teacher/profile.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>Profile</span></a>
</nav>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient('https://txsmxpcnbbjubfpxtdrb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4c214cGNuYmJqdWJmcHh0ZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDEwMjksImV4cCI6MjEwNTg3NzAyOX0.1hKfqjPMeqsMz_MG7fRLttcJapz_FOMTxNDHfp2DJso')

  let currentUser = null
  let combos = []
  let roster = []

  function studentName(s) {
    return [s.surname, s.other_names].filter(Boolean).join(' ') || 'Unnamed Student'
  }
  function initials(s) {
    return ((s.surname || '')[0] || '') + ((s.other_names || '')[0] || '')
  }
  function formatDate(d) {
    if (!d) return '—'
    return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
  }

  async function loadSchoolName() {
    const { data } = await supabase.from('schools').select('name').order('created_at', { ascending: true }).limit(1).single()
    if (data) document.querySelectorAll('.js-school-name').forEach(el => { el.textContent = data.name })
  }

  async function init() {
    loadSchoolName()
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = '/login.html'; return }
    currentUser = session.user

    const { data: membership } = await supabase.from('school_members').select('role').eq('user_id', currentUser.id).single()
    if (!membership || membership.role !== 'teacher') { window.location.href = '/login.html'; return }

    const { data: teacher } = await supabase.from('teachers').select('id').eq('user_id', currentUser.id).single()
    if (!teacher) { document.getElementById('loadingState').textContent = 'No teacher record found for your account.'; return }

    const { data: assignmentData } = await supabase
      .from('teacher_assignments')
      .select('class_id, term_id, classes(name), terms(name)')
      .eq('teacher_id', teacher.id)

    const seen = new Set()
    combos = (assignmentData || []).filter(a => {
      const key = a.class_id + '|' + a.term_id
      if (seen.has(key)) return false
      seen.add(key)
      return true
    })

    document.getElementById('loadingState').style.display = 'none'
    document.getElementById('appWrap').style.display = 'block'

    if (combos.length === 0) {
      document.getElementById('classSelect').innerHTML = '<option>No assignments yet</option>'
      document.getElementById('rosterList').innerHTML = '<p class="empty-note">No classes assigned yet.</p>'
      return
    }

    const select = document.getElementById('classSelect')
    select.innerHTML = combos.map((c, i) => `<option value="${i}">${c.classes?.name || '—'} · ${c.terms?.name || '—'}</option>`).join('')
    select.addEventListener('change', () => loadRoster(combos[select.value]))
    await loadRoster(combos[0])
  }

  async function loadRoster(combo) {
    const container = document.getElementById('rosterList')
    container.innerHTML = '<p class="empty-note">Loading roster…</p>'

    const { data, error } = await supabase
      .from('enrollments')
      .select('student_id, students(id, surname, other_names, admission_number, date_of_birth, gender, photo_url, class_id)')
      .eq('class_id', combo.class_id)
      .eq('term_id', combo.term_id)

    if (error || !data || data.length === 0) {
      container.innerHTML = '<p class="empty-note">No students enrolled in this class for this term yet.</p>'
      roster = []
      return
    }

    roster = data.filter(e => e.students).map(e => e.students).sort((a, b) => (a.surname || '').localeCompare(b.surname || ''))

    container.innerHTML = roster.map(s => `
      <div class="student-card" data-id="${s.id}">
        <div class="student-photo">${s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s)}</div>
        <div class="student-info">
          <div class="name">${studentName(s)}</div>
          <div class="meta">${s.admission_number || 'No admission no.'} · ${s.gender || '—'}</div>
        </div>
      </div>
    `).join('')

    container.querySelectorAll('.student-card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.id))
    })
  }

  function openDetail(studentId) {
    const s = roster.find(r => r.id === studentId)
    if (!s) return
    document.getElementById('detailPhoto').innerHTML = s.photo_url ? `<img src="${s.photo_url}" alt="">` : initials(s)
    document.getElementById('detailName').textContent = studentName(s)
    document.getElementById('detailBody').innerHTML = `
      <div class="detail-row"><span>Admission No.</span><span>${s.admission_number || '—'}</span></div>
      <div class="detail-row"><span>Date of Birth</span><span>${formatDate(s.date_of_birth)}</span></div>
      <div class="detail-row"><span>Gender</span><span>${s.gender || '—'}</span></div>
    `
    document.getElementById('detailOverlay').classList.add('open')
  }
  document.getElementById('detailClose').addEventListener('click', () => document.getElementById('detailOverlay').classList.remove('open'))
  document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'detailOverlay') document.getElementById('detailOverlay').classList.remove('open')
  })

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = '/login.html'
  })

  init()
</script>

</body>
</html>
