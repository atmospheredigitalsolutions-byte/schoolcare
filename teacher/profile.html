<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #101B3D; --navy-deep: #0B1329; --maroon: #6E1F2B; --maroon-dark: #551620;
  --cream: #F6F1E7; --paper: #FBF8F2; --gold: #B98B2A; --ink: #1E1A16;
  --muted: #6b5f52; --border: #E3DACB; --green: #2E7D32; --red: #B3261E;
}
body { font-family: 'Inter', Arial, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.6; min-height: 100vh; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }

.topbar { background: var(--paper); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand img { width: 32px; height: 32px; border-radius: 50%; }
.topbar .brand strong { font-family: 'Fraunces', serif; color: var(--navy); font-size: 15px; }
.topbar .brand span { display: block; font-size: 11px; color: var(--muted); }
.signout { font-size: 13px; font-weight: 600; color: var(--maroon); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; background: var(--paper); }

.wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 90px; }
.welcome h1 { font-size: 24px; color: var(--navy); margin-bottom: 4px; }
.welcome p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

.avatar-block { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.avatar-circle { width: 64px; height: 64px; border-radius: 50%; background: var(--navy); color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; flex-shrink: 0; }
.avatar-block h2 { font-size: 19px; color: var(--navy); }
.avatar-block p { font-size: 13px; color: var(--muted); }

.card { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.card h2 { font-size: 16px; color: var(--navy); margin-bottom: 14px; }
.detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.detail-row:last-child { border-bottom: none; }
.detail-row span:first-child { color: var(--muted); }
.detail-row span:last-child { font-weight: 600; color: var(--ink); }

.field-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field-row label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
input { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
input:focus { outline: none; border-color: var(--navy); }

.btn-save { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--maroon); color: var(--paper); font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-save:disabled { opacity: 0.6; }
.btn-save:hover:not(:disabled) { background: var(--maroon-dark); }

.msg { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; display: none; }
.msg.success { background: #e9f5ea; color: var(--green); display: block; }
.msg.error { background: #fbeaea; color: var(--red); display: block; }
.loading { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
.bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 10px; border-radius: 10px; color: var(--muted); font-size: 10.5px; font-weight: 600; flex: 1; text-align: center; }
.bn-item svg { width: 21px; height: 21px; }
.bn-item.active { color: var(--maroon); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/assets/images/logo.png" alt="logo">
    <div><strong class="js-school-name">Al-Haqq Nur &amp; Pry School</strong><span>Teacher Portal</span></div>
  </div>
  <button class="signout" id="signOutBtn">Sign Out</button>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="welcome">
    <h1>Profile</h1>
    <p>Your account details.</p>
  </div>

  <div class="avatar-block">
    <div class="avatar-circle" id="avatarInitials">T</div>
    <div>
      <h2 id="profileName">—</h2>
      <p>Teacher</p>
    </div>
  </div>

  <div class="card">
    <h2>Account Details</h2>
    <div class="detail-row"><span>Full Name</span><span id="detailFullName">—</span></div>
    <div class="detail-row"><span>Email</span><span id="detailEmail">—</span></div>
    <div class="detail-row"><span>School</span><span id="detailSchool" class="js-school-name">—</span></div>
  </div>

  <div class="card">
    <h2>Change Password</h2>
    <div id="msgBox" class="msg"></div>
    <div class="field-row">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="At least 6 characters">
    </div>
    <div class="field-row">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter new password">
    </div>
    <button class="btn-save" id="savePasswordBtn">Update Password</button>
  </div>
</div>

<div id="loadingState" class="loading">Loading…</div>

<nav class="bottom-nav">
  <a href="/teacher/dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></a>
  <a href="/teacher/students.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Students</span></a>
  <a href="/teacher/report-cards.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Reports</span></a>
  <a href="/teacher/profile.html" class="bn-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>Profile</span></a>
</nav>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient('https://txsmxpcnbbjubfpxtdrb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4c214cGNuYmJqdWJmcHh0ZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDEwMjksImV4cCI6MjEwNTg3NzAyOX0.1hKfqjPMeqsMz_MG7fRLttcJapz_FOMTxNDHfp2DJso')

  function showMessage(text, type) {
    const box = document.getElementById('msgBox')
    box.textContent = text
    box.className = 'msg ' + type
    setTimeout(() => { box.className = 'msg' }, 4000)
  }

  async function loadSchoolName() {
    const { data } = await supabase.from('schools').select('name').order('created_at', { ascending: true }).limit(1).single()
    if (data) document.querySelectorAll('.js-school-name').forEach(el => { el.textContent = data.name })
  }

  async function init() {
    loadSchoolName()
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = '/login.html'; return }
    const user = session.user

    const { data: membership } = await supabase.from('school_members').select('role').eq('user_id', user.id).single()
    if (!membership || membership.role !== 'teacher') { window.location.href = '/login.html'; return }

    const { data: userRow } = await supabase.from('users').select('full_name, email').eq('id', user.id).single()
    const name = userRow?.full_name || 'Teacher'
    const email = userRow?.email || user.email || '—'

    document.getElementById('profileName').textContent = name
    document.getElementById('detailFullName').textContent = name
    document.getElementById('detailEmail').textContent = email
    document.getElementById('avatarInitials').textContent = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase()

    document.getElementById('loadingState').style.display = 'none'
    document.getElementById('appWrap').style.display = 'block'
  }

  document.getElementById('savePasswordBtn').addEventListener('click', async () => {
    const btn = document.getElementById('savePasswordBtn')
    const pass = document.getElementById('newPassword').value
    const confirm = document.getElementById('confirmPassword').value

    if (pass.length < 6) { showMessage('Password must be at least 6 characters.', 'error'); return }
    if (pass !== confirm) { showMessage('Passwords do not match.', 'error'); return }

    btn.disabled = true
    btn.textContent = 'Updating…'

    const { error } = await supabase.auth.updateUser({ password: pass })

    btn.disabled = false
    btn.textContent = 'Update Password'

    if (error) showMessage('Could not update password: ' + error.message, 'error')
    else {
      showMessage('Password updated successfully.', 'success')
      document.getElementById('newPassword').value = ''
      document.getElementById('confirmPassword').value = ''
    }
  })

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = '/login.html'
  })

  init()
</script>

</body>
</html>
